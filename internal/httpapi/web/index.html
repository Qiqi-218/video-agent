<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Video Agent</title>
  <style>
    :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f5f7fb}body{max-width:920px;margin:0 auto;padding:32px 18px}h1{margin:0 0 8px;font-size:30px}p{color:#667085}.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:20px;margin:16px 0;box-shadow:0 4px 16px #1720330a}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.field{flex:1;min-width:190px}label{display:block;font-size:13px;color:#667085;margin-bottom:6px}input{box-sizing:border-box;width:100%;padding:10px;border:1px solid #d0d5dd;border-radius:8px;font-size:14px}button{padding:10px 14px;border:0;border-radius:8px;background:#315efb;color:white;font-weight:600;cursor:pointer}button.secondary{background:#eef2ff;color:#315efb}button:disabled{opacity:.5;cursor:wait}.status{white-space:pre-wrap;background:#111827;color:#d1fae5;border-radius:8px;padding:12px;font:12px ui-monospace,monospace;min-height:22px}.result{border-top:1px solid #eef0f4;padding:12px 0}.time{color:#315efb;font-variant-numeric:tabular-nums}.muted{color:#98a2b3;font-size:13px}.check{display:flex;gap:8px;align-items:center;margin:10px 0}.check input{width:auto}
  </style>
</head>
<body>
  <h1>Video Agent</h1><p>本地视频理解与剪辑助手 · 不需要手写 JSON</p>
  <div class="card"><h2>1. 项目</h2><div class="row"><div class="field"><label>项目 ID</label><input id="project" value="demo"></div><div class="field"><label>项目名称</label><input id="projectName" value="我的视频项目"></div><button onclick="createProject()">创建/确认项目</button></div></div>
  <div class="card"><h2>2. 导入视频</h2><div class="row"><div class="field"><label>视频本地路径（服务所在电脑可访问）</label><input id="videoPath" placeholder="/workspace/input/video.mp4"></div><button onclick="importVideo()">导入视频</button><button class="secondary" onclick="listAssets()">刷新素材</button></div><div id="assets" class="muted">还没有加载素材</div></div>
  <div class="card"><h2>3. 分析与搜索</h2><div class="row"><div class="field"><label>素材 ID</label><input id="asset" placeholder="导入后自动填充"></div><div class="field"><label>SRT/VTT 本地路径（可选）</label><input id="subtitlePath" placeholder="/workspace/input/video.srt"></div></div><label class="check"><input id="visual" type="checkbox" checked> 抽取代表帧（每 10 秒，最多 48 张）</label><button onclick="analyze()">开始分析</button><div class="row" style="margin-top:16px"><div class="field"><label>搜索主题</label><input id="query" placeholder="例如：高能、笑点、进球"></div><button onclick="search()">搜索片段</button></div><div id="results"></div></div>
  <div class="card"><h2>运行状态</h2><div id="status" class="status">等待操作</div></div>
  <script>
    const $=id=>document.getElementById(id); const api=async(name,body)=>{const r=await fetch('/v1/tools/'+name,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const j=await r.json();if(!j.ok)throw new Error((j.error&&j.error.code||'error')+': '+(j.error&&j.error.message||'request failed'));return j.result};
    function show(v){$('status').textContent=typeof v==='string'?v:JSON.stringify(v,null,2)}
    async function createProject(){try{show(await api('project_create',{id:$('project').value,name:$('projectName').value}))}catch(e){if(e.message.includes('already')){show('项目已存在，可以继续使用')}else show(e.message)}}
    async function importVideo(){try{const x=await api('assets_import',{project_id:$('project').value,path:$('videoPath').value});$('asset').value=x.id;show(x);await listAssets()}catch(e){show(e.message)}}
    async function listAssets(){try{const xs=await api('assets_list',{project_id:$('project').value});$('assets').innerHTML=xs.map(x=>`<div class="result"><b>${x.id}</b> · ${(x.duration_us/1e6).toFixed(1)} 秒 · ${x.width}×${x.height}<button class="secondary" style="float:right;padding:5px 8px" onclick="$('asset').value='${x.id}'">使用</button></div>`).join('')||'没有素材'}catch(e){show(e.message)}}
    async function analyze(){try{const x=await api('analyze',{project_id:$('project').value,asset_id:$('asset').value,subtitle_path:$('subtitlePath').value||undefined,visual:$('visual').checked});show({status:x.run.status,stages:x.run.stages,evidence_count:x.evidence.length,cache_key:x.run.cache_key})}catch(e){show(e.message)}}
    async function search(){try{const xs=await api('search',{project_id:$('project').value,query:$('query').value,limit:10});$('results').innerHTML=xs.map(x=>`<div class="result"><div class="time">${(x.start_us/1e6).toFixed(2)}s - ${(x.end_us/1e6).toFixed(2)}s</div><div>${x.transcript||x.visual_summary||''}</div><div class="muted">${x.id}</div></div>`).join('');show('搜索完成，共 '+xs.length+' 个片段')}catch(e){$('results').innerHTML='';show(e.message)}}
  </script>
</body></html>
